<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>유진이네 플리마켓</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="notice.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar profile-topbar">
        <div class="hero-copy">
          <p class="eyebrow">WELCOME TO</p>
          <h1>유진이네 플리마켓</h1>
        </div>
        <div class="session-panel" id="sessionPanel"></div>
      </header>

      <div id="noticeRoot"></div>

      <nav class="tabbar" aria-label="주요 메뉴">
        <button class="tab-button active" id="marketTabButton" type="button" data-view="market">마켓</button>
        <button class="tab-button" id="sellTabButton" type="button" data-view="sell">판매하기</button>
      </nav>

      <main class="layout">
        <section class="view-panel active" id="marketView" data-view-panel="market">
          <section class="market-section" aria-labelledby="marketTitle">
            <div class="section-heading">
              <div>
                <h2 id="marketTitle">판매 중인 물건</h2>
              </div>
              <div class="market-tools">
                <p class="market-count" id="marketCount"></p>
                <label for="marketCategoryFilter">카테고리</label>
                <select id="marketCategoryFilter" aria-label="카테고리 필터">
                  <option value="전체">전체</option>
                </select>
              </div>
            </div>
            <div class="product-grid" id="productGrid"></div>
          </section>
        </section>

        <section class="upload-section view-panel" id="sellView" data-view-panel="sell" aria-labelledby="uploadTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Sell</p>
              <h2 id="uploadTitle">판매 글 올리기</h2>
            </div>
          </div>
          <form class="upload-form" id="uploadForm">
            <label for="productNameInput">상품명</label>
            <input id="productNameInput" maxlength="40" placeholder="예: 접이식 캠핑 의자" required />

            <label for="productImagesInput">사진 최대 3장</label>
            <button class="photo-upload-card" id="photoUploadButton" type="button" aria-controls="productImagesInput">
              <span class="photo-upload-icon" aria-hidden="true"></span>
              <span>사진 추가</span>
              <span class="photo-upload-count" id="photoUploadCount">0 / 3</span>
            </button>
            <input id="productImagesInput" class="product-image-input" type="file" accept="image/*" multiple capture="environment" />
            <div class="product-image-preview" id="productImagePreview" aria-live="polite"></div>

            <label for="descriptionInput">간단한 설명</label>
            <textarea id="descriptionInput" rows="4" maxlength="220" placeholder="상품 상태, 간단한 설명을 작성해주세요."></textarea>

            <label for="categorySelect">카테고리</label>
            <select id="categorySelect" required>
              <option value="전자기기">전자기기</option>
              <option value="의류">의류</option>
              <option value="도서">도서</option>
              <option value="생활용품">생활용품</option>
              <option value="가구">가구</option>
              <option value="기타">기타(직접 입력)</option>
            </select>
            <input id="categoryCustomInput" class="hidden" type="text" placeholder="카테고리를 입력해주세요." />

            <label for="priceInput">금액</label>
            <input id="priceInput" type="text" inputmode="numeric" placeholder="₩ 가격을 입력해주세요" required />

            <button class="primary-button wide" id="productSubmitButton" type="submit">등록하기</button>
            <button class="secondary-button wide hidden" id="cancelProductEditButton" type="button">수정 취소</button>
          </form>
        </section>
      </main>
    </div>

    <template id="productTemplate">
      <article class="product-card">
        <img class="product-image" alt="" />
        <div class="product-body">
          <div class="product-topline">
            <h3></h3>
            <strong class="price"></strong>
          </div>
          <div class="product-meta">
           <span class="seller"></span>

          <div class="like-row">
            <span class="heart-icon">♥</span>
            <span class="like-count"></span>
          </div>
        </div>
        </div>
      </article>
    </template>

    <dialog class="product-detail-modal" id="productDetailModal" aria-labelledby="productDetailTitle">
      <article class="product-detail-panel">
        <header class="detail-sheet-header">
          <span class="detail-sheet-handle" aria-hidden="true"></span>
          <div class="detail-header-actions">
            <div class="detail-more-menu">
              <button class="detail-more-button hidden" type="button" aria-label="상품 더보기" title="더보기" aria-expanded="false">
                <span aria-hidden="true">⋮</span>
              </button>
              <div class="detail-more-popover hidden" role="menu">
                <button class="detail-edit-button" type="button" role="menuitem">수정</button>
                <button class="detail-delete-button" type="button" role="menuitem">삭제</button>
              </div>
            </div>
            <button class="dialog-close-button" type="button" aria-label="상품 상세 닫기" title="닫기">
              <span aria-hidden="true">×</span>
            </button>
          </div>
        </header>

        <section class="detail-media" aria-label="상품 이미지">
          <div class="detail-hero-image" aria-label="대표 이미지"></div>
          <button class="detail-image-nav detail-image-prev hidden" type="button" aria-label="이전 이미지">
            <span aria-hidden="true">‹</span>
          </button>
          <button class="detail-image-nav detail-image-next hidden" type="button" aria-label="다음 이미지">
            <span aria-hidden="true">›</span>
          </button>
          <div class="detail-image-status hidden" aria-live="polite"></div>
          <div class="detail-image-dots hidden" aria-label="상품 이미지 페이지"></div>
        </section>

        <section class="detail-content" aria-label="상품 정보">
          <p class="detail-seller-date">판매자 · 등록일</p>
          <div class="detail-title-row">
            <div class="detail-title-stack">
              <h2 id="productDetailTitle">상품명</h2>
              <p class="detail-price-row">
                <strong class="detail-price">나눔</strong>
                <span aria-hidden="true">|</span>
                <span class="detail-category">카테고리</span>
              </p>
            </div>
            <button class="detail-like-button" type="button" aria-label="찜 개수" title="찜">
              <span class="detail-like-icon" aria-hidden="true">♥</span>
              <span class="detail-like-count">0</span>
            </button>
          </div>
          <p class="detail-description">상품 설명</p>
        </section>

      </article>
    </dialog>

    <dialog class="image-viewer-modal" id="imageViewerModal" aria-label="상품 이미지 확대 보기">
      <div class="image-viewer-panel">
        <button class="image-viewer-close" type="button" aria-label="확대 이미지 닫기" title="닫기">
          <span aria-hidden="true">×</span>
        </button>
        <button class="image-viewer-nav image-viewer-prev hidden" type="button" aria-label="이전 이미지">
          <span aria-hidden="true">‹</span>
        </button>
        <figure class="image-viewer-stage">
          <img class="image-viewer-image" alt="" />
          <figcaption class="image-viewer-status hidden" aria-live="polite"></figcaption>
        </figure>
        <button class="image-viewer-nav image-viewer-next hidden" type="button" aria-label="다음 이미지">
          <span aria-hidden="true">›</span>
        </button>
      </div>
    </dialog>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="app.js?v=notice-component-v1"></script>
  </body>
</html>
