<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>마이페이지 · 우리동네 플리마켓</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">My Page</p>
          <h1>마이페이지</h1>
        </div>
        <div class="session-panel" id="mypageSessionPanel"></div>
      </header>

      <main class="layout mypage-layout">
        <section class="mypage-section" aria-labelledby="profileTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Profile</p>
              <h2 id="profileTitle">내 정보</h2>
            </div>
          </div>

          <form class="profile-form" id="profileForm">
            <div class="avatar-row">
              <div class="avatar-preview" id="avatarPreview" aria-hidden="true">
                <img class="avatar-image hidden" id="avatarImage" alt="" />
                <span class="avatar-initials" id="avatarInitials"></span>
              </div>
              <div class="avatar-fields">
                <p class="profile-nickname" id="profileNickname"></p>
                <label for="avatarInput">프로필 사진</label>
                <input id="avatarInput" name="avatar" type="file" accept="image/*" />
              </div>
            </div>

            <label for="relationshipInput">주인장과의 관계</label>
            <textarea
              id="relationshipInput"
              name="relationship"
              rows="3"
              maxlength="120"
              placeholder="예: 대학 동기, 동네 친구"
            ></textarea>

            <label for="bioInput">자기소개 한줄</label>
            <input
              id="bioInput"
              name="bio"
              maxlength="40"
              placeholder="한 줄로 나를 소개해주세요"
            />

            <label for="visitTimeInput">방문 시간</label>
            <input
              id="visitTimeInput"
              name="visitTime"
              maxlength="40"
              placeholder="예: 토 14:00–16:00"
            />

            <label for="dinnerInput">저녁 먹을까요?</label>
            <select id="dinnerInput" name="dinner">
              <option value="undecided">미정</option>
              <option value="yes">먹을게요</option>
              <option value="no">안 먹어요</option>
            </select>

            <button class="primary-button wide" type="submit">저장하기</button>
          </form>
        </section>

        <section class="mypage-section" aria-labelledby="likedTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Wishlist</p>
              <h2 id="likedTitle">내 찜</h2>
            </div>
            <p class="market-count" id="likedCount"></p>
          </div>
          <div class="product-grid" id="likedGrid"></div>
        </section>

        <section class="mypage-section" aria-labelledby="myProductsTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">My Listings</p>
              <h2 id="myProductsTitle">내가 올린 상품</h2>
            </div>
            <p class="market-count" id="myProductsCount"></p>
          </div>
          <div class="product-grid" id="myProductsGrid"></div>
        </section>
      </main>
    </div>

    <template id="mypageProductTemplate">
      <article class="product-card">
        <img class="product-image" alt="" />
        <div class="product-body">
          <div class="product-topline">
            <h3></h3>
            <strong class="price"></strong>
          </div>
          <div class="seller-row">
            <span class="seller"></span>
            <span class="posted-at"></span>
          </div>
          <div class="mypage-card-actions"></div>
        </div>
      </article>
    </template>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="mypage.js"></script>
  </body>
</html>
