<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입 · 우리동네 플리마켓</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Flea Market</p>
          <h1>우리동네 플리마켓</h1>
        </div>
      </header>

      <main class="layout">
        <section class="login-section" aria-labelledby="signupTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Sign Up</p>
              <h2 id="signupTitle">회원가입</h2>
            </div>
          </div>
          <form class="signup-form" id="signupForm" novalidate>
            <label for="signupId">아이디 <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="signupId" name="id" autocomplete="username" maxlength="20" placeholder="영문/숫자/_ 4~20자" required aria-describedby="signupIdError" />
            <p class="field-error" id="signupIdError" aria-live="assertive"></p>

            <label for="signupPassword">비밀번호 <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="30" placeholder="6자 이상" required aria-describedby="signupPasswordError" />
            <p class="field-error" id="signupPasswordError" aria-live="assertive"></p>

            <label for="signupPasswordConfirm">비밀번호 확인 <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="signupPasswordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" maxlength="30" placeholder="비밀번호 재입력" required aria-describedby="signupPasswordConfirmError" />
            <p class="field-error" id="signupPasswordConfirmError" aria-live="assertive"></p>

            <label for="signupNickname">닉네임 <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="signupNickname" name="nickname" autocomplete="nickname" maxlength="16" placeholder="예: 민지" required aria-describedby="signupNicknameError" />
            <p class="field-error" id="signupNicknameError" aria-live="assertive"></p>

            <label for="signupInvite">초대코드 <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="signupInvite" name="inviteCode" maxlength="24" placeholder="초대코드를 입력하세요" required aria-describedby="signupInviteError" />
            <p class="field-error" id="signupInviteError" aria-live="assertive"></p>

            <button class="primary-button wide" type="submit">회원가입</button>
          </form>
          <p class="auth-switch">
            이미 계정이 있으신가요?
            <a class="link-button" href="login.html">로그인</a>
          </p>
        </section>
      </main>
    </div>

    <!--
      가입 직후 선택 프로필 입력 팝업.
      필수 입력은 위 회원가입 폼에서만 받고, 선택 항목(관계/자기소개/방문시간/저녁/사진)은
      가입 성공 후 이 팝업에서 받는다. 마이페이지 프로필 폼과 같은 항목이라 동일 클래스를 재사용한다.
    -->
    <dialog class="onboarding-modal" id="signupOnboardingModal" aria-labelledby="onboardingTitle">
      <form class="onboarding-panel" id="onboardingForm" method="dialog">
        <header class="onboarding-header">
          <p class="eyebrow">Welcome</p>
          <h2 id="onboardingTitle">프로필을 조금만 채워볼까요?</h2>
          <p class="onboarding-desc">모두 선택 항목이에요. 나중에 마이페이지에서 언제든 수정할 수 있어요.</p>
        </header>

        <div class="onboarding-body">
          <div class="profile-form">
            <div class="avatar-row">
              <!-- 썸네일(원형 클리핑) 위에 수정 버튼을 겹쳐 올리기 위한 래퍼. 마이페이지와 동일 구조 -->
              <div class="avatar-thumb">
                <div class="avatar-preview" id="onboardingAvatarPreview" aria-hidden="true">
                  <img class="avatar-image hidden" id="onboardingAvatarImage" alt="" />
                  <span class="avatar-initials" id="onboardingAvatarInitials"></span>
                </div>
                <!-- 기본 파일 인풋은 시각적으로만 숨기고, 아래 원형 label 버튼이 클릭 시 파일 선택창을 연다 -->
                <input
                  id="onboardingAvatarInput"
                  name="avatar"
                  type="file"
                  accept="image/*"
                  class="file-input"
                  aria-label="프로필 사진 선택"
                />
                <label
                  class="avatar-edit-button"
                  for="onboardingAvatarInput"
                  title="프로필 사진 선택"
                  aria-label="프로필 사진 선택"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="14"
                    height="14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                  </svg>
                </label>
              </div>
              <div class="avatar-fields">
                <p class="profile-nickname" id="onboardingNickname"></p>
              </div>
            </div>

            <label for="onboardingRelationship">주인장과의 관계</label>
            <textarea
              id="onboardingRelationship"
              name="relationship"
              rows="3"
              maxlength="120"
              placeholder="예: 대학 동기, 동네 친구"
            ></textarea>

            <label for="onboardingBio">자기소개 한줄</label>
            <input
              id="onboardingBio"
              name="bio"
              maxlength="40"
              placeholder="한 줄로 나를 소개해주세요"
            />

            <label for="onboardingVisitTime">방문 시간</label>
            <!-- 오후 2시~6시 방문 시각. HH:MM 형식이라 친구맵 타임라인 정렬에 그대로 쓰인다 -->
            <select id="onboardingVisitTime" name="visitTime">
              <option value="">미정</option>
              <option value="14:00">오후 2시</option>
              <option value="15:00">오후 3시</option>
              <option value="16:00">오후 4시</option>
              <option value="17:00">오후 5시</option>
              <option value="18:00">오후 6시</option>
            </select>

            <span class="field-label" id="onboardingDinnerLabel">저녁 먹을까요?</span>
            <!-- 셀렉트 대신 3지선다 버튼. 값은 클릭 시 JS에서 active 상태로 관리한다 (마이페이지와 동일) -->
            <div
              class="choice-group"
              id="onboardingDinnerInput"
              role="group"
              aria-labelledby="onboardingDinnerLabel"
            >
              <button type="button" class="choice-button" data-value="undecided">
                미정
              </button>
              <button type="button" class="choice-button" data-value="yes">
                먹을게요
              </button>
              <button type="button" class="choice-button" data-value="no">
                안 먹어요
              </button>
            </div>
          </div>
        </div>

        <div class="onboarding-actions">
          <!-- 저장/나중에 모두 가입 성공 후이므로, 어느 쪽이든 완료되면 메인으로 이동한다 -->
          <button class="primary-button wide" type="button" id="onboardingSaveButton">저장하기</button>
          <button class="secondary-button wide" type="button" id="onboardingSkipButton">나중에 하기</button>
        </div>
      </form>
    </dialog>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script src="/env-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/supabase-client.js"></script>
    <script type="module" src="signup.js"></script>
  </body>
</html>
