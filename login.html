<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 · 우리동네 플리마켓</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Flea Market</p>
          <h1>우리동네 플리마켓</h1>
        </div>
      </header>

      <main class="layout">
        <section class="login-section" aria-labelledby="loginTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Quick Login</p>
              <h2 id="loginTitle">간단 로그인</h2>
            </div>
          </div>
          <form class="login-form" id="loginForm">
            <label for="idInput">아이디</label>
            <input id="idInput" name="id" autocomplete="username" maxlength="20" placeholder="가입한 아이디" required />
            <label for="passwordInput">비밀번호</label>
            <input id="passwordInput" name="password" type="password" minlength="2" maxlength="30" placeholder="비밀번호" required />
            <button class="primary-button wide" type="submit">입장하기</button>
          </form>
          <p class="auth-switch">
            아직 계정이 없으신가요?
            <a class="link-button" href="signup.html">회원가입</a>
          </p>
        </section>
      </main>
    </div>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="login.js"></script>
  </body>
</html>
